<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>匿名の漂流郵便箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Shippori Mincho',serif;background:#060e1a;}

  .music-btn{
    position:fixed;top:16px;left:16px;z-index:100;
    width:36px;height:36px;border-radius:50%;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(200,215,240,0.2);
    color:rgba(200,215,240,0.6);font-size:15px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all 0.3s;backdrop-filter:blur(6px);
  }
  .music-btn:hover{background:rgba(255,255,255,0.13);border-color:rgba(200,215,240,0.4);}
  .music-btn.playing{border-color:rgba(160,200,255,0.5);color:rgba(180,220,255,0.9);}

  .site{
    background:linear-gradient(180deg,#060e1a 0%,#0d1b2e 35%,#0e2240 65%,#122b4a 100%);
    min-height:100vh;position:relative;overflow:hidden;
  }
  .sky-layer{position:absolute;top:0;left:0;right:0;height:55%;pointer-events:none;overflow:hidden;}
  .star{position:absolute;background:#e8f0ff;border-radius:50%;animation:tw var(--d,3s) var(--delay,0s) infinite alternate;}
  @keyframes tw{from{opacity:.1}to{opacity:.9}}
  .moon{position:absolute;top:24px;right:80px;width:48px;height:48px;background:radial-gradient(circle at 35% 35%,#f8f0d0,#ddd0a0);border-radius:50%;z-index:2;box-shadow:0 0 24px rgba(240,220,160,0.4),0 0 70px rgba(240,220,160,0.15);}
  .ocean{position:absolute;bottom:0;left:0;right:0;height:42%;background:linear-gradient(180deg,#0e2a4a 0%,#0a1e38 60%,#081628 100%);overflow:hidden;}
  .wave{position:absolute;left:-50%;width:200%;border-radius:50%;opacity:0.18;animation:wv 8s linear infinite;}
  .wave1{top:-12px;height:50px;background:#4a9eda;animation-duration:7s;}
  .wave2{top:-6px;height:40px;background:#2a7ab8;animation-duration:9s;animation-delay:-3s;opacity:0.12;}
  .wave3{top:0;height:30px;background:#6ab0e0;animation-duration:11s;animation-delay:-5s;opacity:0.1;}
  @keyframes wv{from{transform:translateX(0)}to{transform:translateX(25%)}}
  .island-wrap{position:absolute;bottom:38%;left:50%;transform:translateX(-50%);width:300px;z-index:4;}
  .view{display:none;width:100%;}
  .view.active{display:block;}
  .scene-view{position:relative;min-height:100vh;}
  .title-area{position:absolute;top:28px;left:0;right:0;text-align:center;z-index:10;}
  .title-jp{font-family:'Noto Serif JP',serif;font-weight:200;font-size:14px;color:rgba(200,210,240,0.55);letter-spacing:6px;margin-bottom:6px;}
  .title-main{font-family:'Noto Serif JP',serif;font-weight:300;font-size:22px;color:rgba(210,225,255,0.85);letter-spacing:10px;}
  .float-hint{position:absolute;bottom:calc(38% + 165px);left:50%;transform:translateX(-50%);z-index:20;text-align:center;white-space:nowrap;}
  .hint-text{font-family:'Noto Serif JP',serif;font-weight:200;font-size:11px;color:rgba(200,215,240,0.55);letter-spacing:3px;animation:bob 3s ease-in-out infinite;display:block;}
  .hint-arrow{color:rgba(200,215,240,0.35);font-size:14px;animation:bob 3s ease-in-out infinite;display:block;margin-top:3px;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .write-btn{position:absolute;bottom:calc(38% + 12px);left:50%;transform:translateX(-34px);z-index:20;background:rgba(192,57,43,0.88);border:1px solid rgba(255,200,180,0.3);border-radius:22px;color:#fde8e0;font-family:'Noto Serif JP',serif;font-size:13px;font-weight:300;letter-spacing:3px;padding:10px 22px;cursor:pointer;transition:all 0.3s;backdrop-filter:blur(4px);}
  .write-btn:hover{background:rgba(212,77,63,0.95);box-shadow:0 4px 24px rgba(192,57,43,0.55);transform:translateX(-34px) translateY(-2px);}
  .bottle{position:absolute;z-index:3;opacity:0.4;animation:float-bottle var(--bt,12s) ease-in-out infinite;font-size:20px;}
  @keyframes float-bottle{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-12px) rotate(8deg)}}

  .letter-view{background:linear-gradient(160deg,#0a1628,#0e2240);min-height:100vh;padding:36px 20px 40px;position:relative;overflow:hidden;}
  .letter-bg-deco{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;background:radial-gradient(ellipse at 80% 20%,rgba(42,90,138,0.15) 0%,transparent 60%),radial-gradient(ellipse at 20% 80%,rgba(42,90,138,0.10) 0%,transparent 50%);}
  .letter-header{display:flex;align-items:center;gap:14px;margin-bottom:24px;position:relative;z-index:2;max-width:520px;margin-left:auto;margin-right:auto;}
  .back-btn{background:none;border:1px solid rgba(200,215,240,0.2);border-radius:50%;width:34px;height:34px;color:rgba(200,215,240,0.6);font-size:15px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .back-btn:hover{border-color:rgba(200,215,240,0.5);color:rgba(200,215,240,0.9);}
  .letter-title{font-family:'Noto Serif JP',serif;font-weight:200;font-size:15px;color:rgba(200,215,240,0.6);letter-spacing:5px;}
  .paper-wrap{position:relative;z-index:2;max-width:520px;margin:0 auto;}
  .paper{background:linear-gradient(160deg,#f7f0e0,#f0e8d0);border-radius:2px 2px 0 0;padding:34px 30px 28px;position:relative;box-shadow:0 10px 50px rgba(0,0,0,0.55),0 2px 10px rgba(0,0,0,0.35);}
  .paper::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#8b7355,#c4a96e,#8b7355);border-radius:2px 2px 0 0;}
  .paper-lines{position:absolute;top:68px;left:30px;right:30px;bottom:0;pointer-events:none;background-image:repeating-linear-gradient(transparent,transparent 28px,rgba(160,140,100,0.15) 28px,rgba(160,140,100,0.15) 29px);}
  .paper-deco{font-family:'Noto Serif JP',serif;font-weight:200;font-size:11px;color:rgba(100,80,50,0.45);letter-spacing:4px;margin-bottom:18px;text-align:center;border-bottom:1px solid rgba(160,130,80,0.22);padding-bottom:12px;}
  .no-address{font-family:'Noto Serif JP',serif;font-weight:200;font-size:11px;color:rgba(120,100,65,0.5);letter-spacing:2px;margin-bottom:20px;font-style:italic;}
  .letter-input{width:100%;background:transparent;border:none;outline:none;font-family:'Shippori Mincho',serif;font-size:15px;color:#2c1810;line-height:29px;resize:none;min-height:240px;letter-spacing:1px;}
  .letter-input::placeholder{color:rgba(120,100,70,0.4);}
  .char-note{text-align:right;font-size:11px;color:rgba(100,80,50,0.4);margin-top:8px;font-family:'Noto Serif JP',serif;}
  .seal-area{background:linear-gradient(160deg,#ede5ce,#e8dcc0);padding:18px 30px 22px;border-top:1px solid rgba(160,130,80,0.3);border-radius:0 0 2px 2px;box-shadow:0 10px 50px rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .postmark{width:54px;height:54px;border:2px solid rgba(192,57,43,0.5);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;position:relative;}
  .postmark::before{content:'';position:absolute;width:48px;height:48px;border:1px solid rgba(192,57,43,0.3);border-radius:50%;}
  .postmark-text{font-family:'Noto Serif JP',serif;font-weight:200;font-size:8px;color:rgba(192,57,43,0.65);letter-spacing:1px;}
  .send-btn{background:linear-gradient(135deg,#8b2020,#c0392b);border:none;border-radius:24px;color:#fde8e0;font-family:'Noto Serif JP',serif;font-weight:300;font-size:14px;letter-spacing:4px;padding:13px 30px;cursor:pointer;transition:all 0.3s;flex:1;}
  .send-btn:hover{background:linear-gradient(135deg,#a02828,#d44e3e);box-shadow:0 6px 28px rgba(192,57,43,0.55);transform:translateY(-1px);}
  .send-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

  .success-view{background:linear-gradient(160deg,#0a1628,#0e2240);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden;}
  .success-icon{font-size:56px;margin-bottom:22px;animation:rise 0.8s ease;}
  @keyframes rise{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}
  .success-title{font-family:'Noto Serif JP',serif;font-weight:200;font-size:20px;color:rgba(210,225,255,0.85);letter-spacing:7px;margin-bottom:16px;text-align:center;}
  .success-sub{font-family:'Noto Serif JP',serif;font-weight:200;font-size:13px;color:rgba(160,180,220,0.6);letter-spacing:3px;text-align:center;line-height:2.2;margin-bottom:36px;}
  .again-btn{background:none;border:1px solid rgba(200,215,240,0.25);border-radius:22px;color:rgba(200,215,240,0.6);font-family:'Noto Serif JP',serif;font-weight:200;font-size:13px;letter-spacing:3px;padding:12px 28px;cursor:pointer;transition:all 0.3s;}
  .again-btn:hover{border-color:rgba(200,215,240,0.5);color:rgba(200,215,240,0.9);}

  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(12,30,55,0.96);color:rgba(200,225,255,0.88);font-family:'Noto Serif JP',serif;font-weight:200;font-size:12px;letter-spacing:2px;padding:11px 26px;border-radius:22px;border:1px solid rgba(100,160,220,0.3);transition:transform 0.4s ease;z-index:200;white-space:nowrap;pointer-events:none;}
  .toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<script>
/* ── Stars ── */
(function(){
  const c=document.getElementById('skyLayer');
  for(let i=0;i<60;i++){
    const s=document.createElement('div');
    s.className='star';
    const sz=Math.random()*2+0.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*4}s;`;
    c.appendChild(s);
  }
})();

/* ── EmailJS config ── */
const W3F_KEY = 'e1747bcb-595d-420f-9198-9407d2183fee';


/* ── Views ── */
function showView(id){
  ['sceneView','writeView','successView'].forEach(v=>{
    document.getElementById(v).classList.toggle('active',v===id);
  });
}
function updateCount(){
  document.getElementById('letterCount').textContent=document.getElementById('letterContent').value.length;
}

/* ── Toast ── */
let toastTimer=null;
function showToast(msg,ms=3200){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),ms);
}

/* ── Send via EmailJS ── */
async function sendLetter(){
  const text=document.getElementById('letterContent').value.trim();
  if(!text){showToast('手紙に言葉を書いてください…');return;}

  const btn=document.getElementById('sendBtn');
  btn.disabled=true;btn.textContent='送信中…';

  const d=new Date().toLocaleString('ja-JP',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
  try{
    const resp = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
      body: JSON.stringify({
        access_key: W3F_KEY,
        subject: '【匿名の漂流手紙】',
        from_name: '匿名の漂流郵便箱',
        message: `差出人：匿名\n宛先：どこかへ\n投函日時：${d}\n\n――――――――――――\n\n${text}\n\n――――――――――――\n\nこの手紙は波に乗って届きました。`
      })
    });
    const result = await resp.json();
    console.log('Web3Forms:', result);
    if(!result.success) throw new Error(result.message || 'failed');
    showView('successView');
  }catch(err){
    console.error('EmailJS error:', err);
    const detail = err && err.message ? err.message : String(err);
    showToast('送信失敗：' + detail, 6000);
    btn.disabled=false; btn.textContent='投函する ✉';
  }
}

function writeAgain(){
  document.getElementById('letterContent').value='';
  document.getElementById('letterCount').textContent='0';
  const btn=document.getElementById('sendBtn');
  btn.disabled=false;btn.textContent='投函する ✉';
  showView('sceneView');
}

/* ══════════════════════════════════
   Generative Music — Web Audio API
   海浪白噪音 + C 五聲音階鋼琴
══════════════════════════════════ */
let AC=null, masterGain=null, musicOn=false;
let oceanSrc=null, oceanLfo=null, pianoTimer=null;

const PENTATONIC=[
  261.63,293.66,329.63,392.00,440.00,   // C4 D4 E4 G4 A4
  523.25,587.33,659.25,783.99,880.00,   // C5 D5 E5 G5 A5
  196.00,220.00                          // G3 A3 (bass)
];

function initAC(){
  if(AC) return;
  AC=new(window.AudioContext||window.webkitAudioContext)();
  masterGain=AC.createGain();
  masterGain.gain.value=0;
  masterGain.connect(AC.destination);
}

function buildOcean(){
  const len=AC.sampleRate*5;
  const buf=AC.createBuffer(1,len,AC.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;

  oceanSrc=AC.createBufferSource();
  oceanSrc.buffer=buf; oceanSrc.loop=true;

  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;lp.Q.value=0.7;
  const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=70;

  const wg=AC.createGain();wg.gain.value=0.22;

  /* swell LFO */
  oceanLfo=AC.createOscillator();
  oceanLfo.frequency.value=0.07;
  const lg=AC.createGain();lg.gain.value=0.09;
  oceanLfo.connect(lg);lg.connect(wg.gain);
  oceanLfo.start();

  oceanSrc.connect(hp);hp.connect(lp);lp.connect(wg);wg.connect(masterGain);
  oceanSrc.start();
}

function pianoNote(freq,startTime,dur,vel){
  const env=AC.createGain();
  env.gain.setValueAtTime(0,startTime);
  env.gain.linearRampToValueAtTime(vel,startTime+0.025);
  env.gain.exponentialRampToValueAtTime(vel*0.35,startTime+0.35);
  env.gain.exponentialRampToValueAtTime(0.0001,startTime+dur);

  /* fundamental */
  const o1=AC.createOscillator();o1.type='sine';o1.frequency.value=freq;
  /* 2nd harmonic */
  const o2=AC.createOscillator();o2.type='sine';o2.frequency.value=freq*2;
  const g2=AC.createGain();g2.gain.value=0.1;
  /* 3rd harmonic (warmth) */
  const o3=AC.createOscillator();o3.type='sine';o3.frequency.value=freq*3;
  const g3=AC.createGain();g3.gain.value=0.04;

  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;

  o1.connect(lp);
  o2.connect(g2);g2.connect(lp);
  o3.connect(g3);g3.connect(lp);
  lp.connect(env);env.connect(masterGain);

  const end=startTime+dur+0.1;
  o1.start(startTime);o1.stop(end);
  o2.start(startTime);o2.stop(end);
  o3.start(startTime);o3.stop(end);
}

function schedulePhrase(){
  const now=AC.currentTime+0.05;
  /* 2–4 note phrase, gently arpeggiated */
  const count=Math.random()<0.3?4:Math.random()<0.5?3:2;
  const pool=PENTATONIC.slice();
  for(let i=0;i<count;i++){
    const freq=pool[Math.floor(Math.random()*pool.length)];
    const vel=0.045+Math.random()*0.055;
    const dur=1.8+Math.random()*1.2;
    pianoNote(freq, now+i*0.28, dur, vel);
  }
}

const GAPS=[3800,4500,5200,4000,6000,3500,5800];
let gapIdx=0;

function startMusic(){
  initAC();
  if(AC.state==='suspended') AC.resume();
  buildOcean();
  masterGain.gain.cancelScheduledValues(AC.currentTime);
  masterGain.gain.setValueAtTime(0,AC.currentTime);
  masterGain.gain.linearRampToValueAtTime(0.65,AC.currentTime+2.5);
  schedulePhrase();
  function loop(){
    schedulePhrase();
    gapIdx=(gapIdx+1)%GAPS.length;
    pianoTimer=setTimeout(loop,GAPS[gapIdx]);
  }
  pianoTimer=setTimeout(loop,GAPS[0]);
}

function stopMusic(){
  clearTimeout(pianoTimer);pianoTimer=null;
  if(!masterGain) return;
  masterGain.gain.cancelScheduledValues(AC.currentTime);
  masterGain.gain.linearRampToValueAtTime(0,AC.currentTime+1.8);
  setTimeout(()=>{
    try{oceanSrc&&oceanSrc.stop();}catch(e){}
    try{oceanLfo&&oceanLfo.stop();}catch(e){}
    oceanSrc=null;oceanLfo=null;
  },2000);
}

function toggleMusic(){
  const btn=document.getElementById('musicBtn');
  if(musicOn){
    stopMusic();musicOn=false;
    btn.classList.remove('playing');btn.textContent='♪';
    showToast('音楽を停止しました');
  } else {
    startMusic();musicOn=true;
    btn.classList.add('playing');btn.textContent='♫';
    showToast('海と鋼琴の音楽が流れています…');
  }
}
</script>
